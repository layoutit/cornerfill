<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="color-scheme" content="only light">
<title>Cornerfill oracle fixture</title>
<link rel="stylesheet" href="/__cornerfill/compiled.css">
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; min-width: 100%; min-height: 100%; background: transparent; }
  body { overflow: hidden; }
  #capture {
    position: relative;
    display: grid;
    place-items: center;
    overflow: visible;
    background: transparent;
    isolation: isolate;
  }
  #face {
    display: block;
    margin: 0;
    padding: 0;
    background-color: transparent;
    background-repeat: no-repeat;
    transform-origin: 50% 50%;
    transform-style: preserve-3d;
    backface-visibility: visible;
  }
  #fallback-canvas {
    position: absolute;
    left: -100000px;
    top: -100000px;
    visibility: hidden;
    pointer-events: none;
  }
</style>
<div id="capture"><div id="face"></div></div>
<script type="module" src="./fixture.mjs"></script>
</html>
