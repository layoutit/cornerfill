<!doctype html>
<meta charset="utf-8">
<title>Live paint surface rotation probe</title>
<style>
  html, body { margin: 0; width: 100%; height: 100%; overflow: clip; background: #12162b; }
  body { display: grid; place-items: center; perspective: 600px; }
  #face {
    width: 240px;
    height: 160px;
    background-repeat: no-repeat;
    background-size: 100% 100%;
    transform: rotateX(31deg) rotateY(47deg) rotateZ(13deg);
    transform-style: preserve-3d;
  }
</style>
<div id="face"></div>
<script>
  const width = 240;
  const height = 160;
  const face = document.querySelector('#face');
  let context;
  let backend;

  if (typeof document.getCSSCanvasContext === 'function') {
    backend = 'webkit-canvas';
    context = document.getCSSCanvasContext('2d', 'corner-shape-probe', width, height);
    face.style.backgroundImage = '-webkit-canvas(corner-shape-probe)';
  } else {
    backend = 'moz-element';
    const canvas = document.createElement('canvas');
    canvas.width = width;
    canvas.height = height;
    canvas.id = 'corner-shape-probe';
    canvas.hidden = true;
    document.body.append(canvas);
    context = canvas.getContext('2d');
    if (typeof document.mozSetImageElement === 'function') {
      document.mozSetImageElement('corner-shape-probe', canvas);
    }
    face.style.backgroundImage = '-moz-element(#corner-shape-probe)';
  }

  function repaint(phase = 0) {
    context.clearRect(0, 0, width, height);
    context.save();
    context.beginPath();
    context.moveTo(width / 2, 0);
    context.lineTo(width, height);
    context.lineTo(0, height);
    context.closePath();
    context.clip();
    const gradient = context.createLinearGradient(0, 0, width, height);
    gradient.addColorStop(0, phase ? '#75f6ff' : '#ffdc5e');
    gradient.addColorStop(0.52, phase ? '#2757d7' : '#ff3c54');
    gradient.addColorStop(1, phase ? '#172a73' : '#671348');
    context.fillStyle = gradient;
    context.fillRect(0, 0, width, height);
    context.fillStyle = '#fff';
    context.fillRect(width / 2 - 7, 13, 14, 14);
    context.restore();
    document.documentElement.dataset.phase = String(phase);
  }

  window.repaint = repaint;
  repaint(0);
  document.documentElement.dataset.backend = backend;
  document.documentElement.dataset.ready = 'true';
</script>
