<!doctype html>
<meta charset="utf-8">
<title>Cornerfill runtime hardening regressions</title>
<body>
  <output id="status">running</output>
  <script>
    const fail = event => {
      document.documentElement.dataset.runtimeRegressions = "fail";
      const error = event.reason || event.error;
      const stage = globalThis.__CORNERFILL_TEST_STAGE__
        ? `\nstage: ${globalThis.__CORNERFILL_TEST_STAGE__}`
        : "";
      document.querySelector("#status").textContent = error
        ? `${error.message || "runtime regression failed"}\n${error.stack || ""}${stage}`
        : event.message || "runtime regression failed";
    };
    addEventListener("error", fail);
    addEventListener("unhandledrejection", fail);
  </script>
  <script type="module" src="./runtime-regression.mjs"></script>
</body>
