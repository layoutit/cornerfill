name: CI

permissions:
  contents: read

on:
  pull_request:
  push:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: npx playwright install --with-deps chromium webkit firefox
      - run: npm run test:browser:runtime:built
      - run: npm pack --dry-run --json
      - run: node scripts/oracle.mjs run --browsers=chrome,webkit,firefox --cases=bevel,bevel-rotated
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cornerfill-oracle
          path: oracle/results/
          retention-days: 14
