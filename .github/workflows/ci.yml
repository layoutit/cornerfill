name: CI

on:
  pull_request:
  push:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
      - run: npx --yes --package @playwright/cli@0.1.17 playwright install --with-deps chromium webkit firefox
      - run: npm run test:browser:runtime
